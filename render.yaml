services:
  - type: web
    name: cartguard
    runtime: node
    # Free plan: keep an external pinger hitting /api/ping every 5-10 minutes
    # so the instance doesn't sleep. Sessions live in external Postgres
    # (DATABASE_URL), so restarts and deploys don't log merchants out.
    plan: free
    region: ohio
    # --include=dev: NODE_ENV=production would otherwise skip the build tools.
    buildCommand: npm install --include=dev && npm run build
    # migrate deploy applies pending migrations on every boot. It is idempotent
    # and a no-op when the schema is current, so there is no separate release
    # step to forget. A fresh database would otherwise start with no tables.
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: SHOPIFY_APP_URL
        value: https://cartguard-co1f.onrender.com
      - key: SCOPES
        value: read_orders,read_products,write_validations
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
