api_version = "2026-07"

[[extensions]]
name = "CartGuard Validator"
handle = "cartguard-validator"
type = "function"

  [[extensions.targeting]]
  target = "cart.validations.generate.run"
  input_query = "src/run.graphql"
  export = "run"

  [extensions.build]
  command = ""
  typegen_command = "npm run typegen"
  path = "dist/index.wasm"

  # Variables for src/run.graphql ($limitTags). The app writes this metafield
  # on CartGuard's Validation when the merchant saves rules.
  [extensions.input.variables]
  namespace = "$app:cartguard"
  key = "function-configuration"
