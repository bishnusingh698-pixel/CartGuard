client_id = "YOUR_CLIENT_ID"
name = "CartGuard"
application_url = "https://your-production-url.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "your-test-store.myshopify.com"
include_config_on_deploy = true

[access_scopes]
scopes = "read_products,read_orders,write_metafields"

[auth]
redirect_urls = [
  "https://your-production-url.com/auth/callback",
  "https://your-production-url.com/auth/shopify/callback",
  "https://your-production-url.com/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks"

[pos]
embedded = false
